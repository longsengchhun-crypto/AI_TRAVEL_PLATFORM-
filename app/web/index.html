<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="WAYFARER: discover destinations, search hotels with real availability and plan day-by-day itineraries across Cambodia and Southeast Asia. Academic demo.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="wayfarer">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#2F5D50">
  <title>WAYFARER – Travel, hotels and trip planning</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <style>
    html,body{margin:0;background:#FAF7F0}
    #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FAF7F0;color:#1E2421;font-family:Georgia,serif;letter-spacing:.25em;transition:opacity .3s}
    #splash .bar{margin-top:18px;width:120px;height:2px;background:#E2DCCD;overflow:hidden;border-radius:2px}
    #splash .bar i{display:block;width:40%;height:100%;background:#2F5D50;animation:wf 1.1s ease-in-out infinite}
    @keyframes wf{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
    @media (prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}}
  </style>
  <div id="splash" role="status" aria-label="Loading WAYFARER"><div>WAYFARER</div><div class="bar"><i></i></div></div>
  <script>window.addEventListener('flutter-first-frame',function(){var e=document.getElementById('splash');if(e){e.style.opacity=0;setTimeout(function(){e.remove()},320)}});</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
